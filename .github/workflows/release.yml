name: release

# 버전 태그(v*)를 push하면 변경 내역만 담은 draft Release를 만든다.
# 판매 중에는 공개 Release와 Actions 아티팩트에 설치 파일을 올리지 않는다
# (docs/decisions/paid-distribution.md). Developer ID 서명·공증 빌드는 게이트 실패
# 대비 경로가 살아 있는지 확인하려고 러너 안에서만 만들고 어디에도 업로드하지 않는다.
# 릴리즈 노트는 GitHub 내장 자동 생성(지난 태그 이후 머지된 PR 목록).
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # tagName/releaseId를 주지 않으면 tauri-action은 빌드만 하고 업로드하지 않는다.
      - name: Build signed & notarized universal app (not uploaded)
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target universal-apple-darwin

      - name: Verify notarization
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Arrowly.app
          spctl -a -vv -t install "$APP"
          xcrun stapler validate "$APP"

      - name: Create draft release (notes only, no installer assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "Arrowly ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
