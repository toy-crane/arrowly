<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrowly · 최종 스토어 이미지</title><style>body{margin:0;padding:28px;color:#1c1e24;font-family:system-ui;background:#fff}header{margin-bottom:24px}h1{margin:0 0 8px;font-size:24px}p{color:#72727a;font-size:13px;margin:0 0 14px}select,a.download{font:inherit;font-size:13px;padding:7px 12px;background:#f5f5f7;border:1px solid #dddde2;border-radius:7px;color:inherit;text-decoration:none}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}article{min-width:0}h2{font-size:14px;font-weight:600;margin:0 0 8px}img{display:block;width:100%;border-radius:8px}a:focus{outline:2px solid #ffd400}</style><header><h1>Arrowly · 최종 스토어 이미지</h1><p>한국어 5장 · English 5장 · 2880 × 1800 · RGB PNG</p><select aria-label="언어" id="language"><option value="ko">한국어</option><option value="en">English</option></select></header><main><article><h2>1. 핵심 강조</h2><a href="exports/ko/01-hero.png" target="_blank"><img data-file="01-hero.png" src="exports/ko/01-hero.png" alt="핵심 강조"></a></article><article><h2>2. 플로팅 마커</h2><a href="exports/ko/02-marker.png" target="_blank"><img data-file="02-marker.png" src="exports/ko/02-marker.png" alt="플로팅 마커"></a></article><article><h2>3. 화살표와 도형</h2><a href="exports/ko/03-shapes.png" target="_blank"><img data-file="03-shapes.png" src="exports/ko/03-shapes.png" alt="화살표와 도형"></a></article><article><h2>4. 블랙보드</h2><a href="exports/ko/04-blackboard.png" target="_blank"><img data-file="04-blackboard.png" src="exports/ko/04-blackboard.png" alt="블랙보드"></a></article><article><h2>5. 확대</h2><a href="exports/ko/05-magnifier.png" target="_blank"><img data-file="05-magnifier.png" src="exports/ko/05-magnifier.png" alt="확대"></a></article></main><script>document.querySelector('#language').onchange=e=>document.querySelectorAll('img').forEach(i=>{i.src='exports/'+e.target.value+'/'+i.dataset.file;i.parentElement.href=i.src})</script></html>
